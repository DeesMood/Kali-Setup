# ==========================================
# Core Functionality & Key Bindings
# ==========================================
# Use vi-style key bindings in copy mode
setw -g mode-keys vi
# Wayland alternative -- comment the line above and uncomment this one instead:
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
# Split panes using current directory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# Remove Neovim Esc key delay
set -sg escape-time 0
# Enable mouse mode (tmux 2.1 and above)
set -g mouse on
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# ==========================================
# UI & Theme (Tokyo Night, on Kali Dark terminal bg)
# ==========================================
# Background=35,37,46 (#23262e) from the Kali terminal profile, with
# Tokyo Night's blue-purple accent (#7aa2f7) as the single hue against
# gray -- same "one accent, brightness carries hierarchy" principle as
# before, just swapped from the muted blue-gray palette to Tokyo Night.
set -g status-style bg=default,fg="#c0caf5"
# Pane borders (periwinkle accent for active, dark slate for inactive)
set -g pane-active-border-style fg="#7aa2f7"
set -g pane-border-style fg="#1f2229"
# Left status: bright foreground session name (matches Normal guifg in vimrc)
set -g status-left "#[fg=#e6e6e6,bold]  #S "
set -g status-left-length 30
# Right status: light lavender time, dim slate date
set -g status-right "#[fg=#c0caf5,bold]%H:%M #[fg=#565f89]%d-%b "
# Window status formatting
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W*"
setw -g window-status-format "#[fg=#565f89] #I:#W "
# ==========================================
# Plugins (TPM)
# ==========================================
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # A set of highly acceptable default settings
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Automatically restore last saved environment when tmux starts
set -g @continuum-restore 'on'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
# Automatic Reindexing
set-option -g renumber-windows on
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
# Smart pane switching that works with vim splits too
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
